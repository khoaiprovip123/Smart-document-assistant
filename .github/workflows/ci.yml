name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Validate development manifest
        run: npm run validate:manifest
      - name: Generate production manifest
        env:
          ADDIN_ORIGIN: https://addin.example.com
        run: npm run build:manifest
      - name: Validate production manifest
        run: npm run validate:manifest:production
